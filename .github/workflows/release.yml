name: Release

# La release ne part qu'après la fin VERTE de « CI » sur un push de main (mission 015) :
# workflow_run s'exécute depuis la branche par défaut, sur le head_sha du run de CI.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Tests verts, sur un push de main (jamais une PR, jamais un run rouge ou annulé).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      # On construit exactement le commit que la CI a testé.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Missions 023 et 031 : pas de tag, de release ni d'APK si le commit n'est plus la tête de main, ou si rien de l'application (tests exclus) n'a changé depuis
      # le dernier tag v* (comparaison au tag, pas au commit précédent). Règle : .github/scripts/.
      - name: Décider si une release est nécessaire
        id: decision
        run: |
          RES=$(.github/scripts/release-necessaire.sh "${{ github.event.workflow_run.head_sha }}")
          echo "$RES"
          case "$RES" in
            "pas de release"*) echo "necessaire=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "necessaire=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "### Release : $RES" >> "$GITHUB_STEP_SUMMARY"

      # Mission 036 : version calendaire vAAAA.MM.N (N = compteur du mois, UTC, repart à 1 chaque mois),
      # calculée par .github/scripts/version-calendaire.sh d'après les tags existants ; tag annoté sur head_sha.
      - name: Calculer la version
        id: tag
        if: steps.decision.outputs.necessaire == 'true'
        run: |
          TAG=$(.github/scripts/version-calendaire.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Marculus $TAG" "${{ github.event.workflow_run.head_sha }}"
          git push origin "refs/tags/$TAG"
          echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configurer JDK 21
        if: steps.tag.outputs.new_tag != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer le SDK Android
        if: steps.tag.outputs.new_tag != ''
        uses: android-actions/setup-android@v3
        with:
          # Le paquet « tools » (installé par défaut) n'existe plus avec les cmdline-tools 16.
          packages: platform-tools

      - name: Configurer Gradle
        if: steps.tag.outputs.new_tag != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature release
        if: steps.tag.outputs.new_tag != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Clé release détectée → APK signé release (mises à jour possibles)."
          else
            echo "Aucune clé release (secret RELEASE_KEYSTORE_BASE64 absent) → repli signature debug."
          fi

      - name: Compiler l'APK release
        if: steps.tag.outputs.new_tag != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ steps.tag.outputs.new_version }}
          -PappVersionCode=${{ github.run_number }}

      - name: Nommer l'APK (préfixe marculus + version + horodatage UTC)
        if: steps.tag.outputs.new_tag != ''
        id: apk
        run: |
          NAME="marculus-${{ steps.tag.outputs.new_tag }}-$(date -u +%Y%m%d-%H%M).apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Créer la release GitHub
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Marculus ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.name }}
